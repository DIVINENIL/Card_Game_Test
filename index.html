<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Anime Card Fight</title>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0c0a1a;--p:#171335;--t:#f2efff;--m:#9a93c9;--a:#ff3d81;--b:#35e0ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:var(--t);background:#2a2460;border:1px solid #4a42a0;border-radius:8px;padding:8px 12px;cursor:pointer}button:hover:not(:disabled){background:#3a3290}button:disabled{opacity:.5;cursor:default}
button.pri{background:linear-gradient(90deg,var(--a),#a83dff);border:0;font-weight:700}
#menu{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
#menu h1{font-size:34px;margin:0;background:linear-gradient(90deg,var(--b),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
#menu input{font:inherit;padding:8px;width:110px;text-align:center;border-radius:8px;border:1px solid #4a42a0;background:var(--p);color:var(--t)}
.rules{max-width:460px;color:var(--m);font-size:12px;line-height:1.5}
#game{height:100%;display:none;flex-direction:column;gap:4px;padding:6px;max-width:900px;margin:auto}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--p);border-radius:8px;padding:5px 9px;font-size:12px}
.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:128px;align-items:center}
.ch{position:relative;width:104px;background:linear-gradient(160deg,var(--c),#120f2c 75%);border:2px solid #fff3;border-radius:10px;padding:5px;text-align:center;cursor:pointer;transition:filter .2s}
.ch .em{font-size:36px;line-height:1.1}.ch .portrait{display:block;width:100%;height:72px;object-fit:cover;object-position:center 25%;border-radius:6px;margin-bottom:3px}.ch b{font-size:12px;display:block}.ch small{font-size:11px;display:block}
.ch.dim{filter:saturate(.3) brightness(.7)}.ch.sel{border-color:var(--b);box-shadow:0 0 14px var(--b)}.ch.tgt{border-color:var(--a);box-shadow:0 0 14px var(--a);animation:pl .6s infinite alternate}
.bar{height:6px;background:#0008;border-radius:3px;overflow:hidden;margin:3px 0}.bar i{display:block;height:100%;background:#4ade80;transition:width .4s}
#mid{text-align:center;font-size:12px;color:var(--m);min-height:44px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.dm2{display:inline-block;padding:2px 8px;border-radius:10px;background:#3b1b6b;color:#e9c8ff;margin:0 3px;cursor:help}
#act{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;min-height:0}
#hand{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;min-height:104px}
.cd{flex:0 0 86px;background:linear-gradient(160deg,var(--c,#555),#120f2c 80%);border:2px solid #fff3;border-radius:9px;padding:5px;text-align:center;cursor:pointer;font-size:11px}
.cd .em{font-size:28px}.cd .portrait{display:block;width:100%;height:78px;object-fit:cover;object-position:center 25%;border-radius:5px;margin-bottom:3px}.cd small{display:block;color:var(--m)}.cd.e{--c:#2d7a6a}.cd.no{opacity:.45}
@keyframes pl{to{transform:scale(1.05)}}
.fl{position:fixed;z-index:30;font-weight:900;font-size:26px;pointer-events:none;text-shadow:0 0 6px #000,0 0 12px currentColor;animation:fu 1s forwards}
@keyframes fu{to{transform:translateY(-50px);opacity:0}}
.pr{position:fixed;z-index:30;font-size:30px;pointer-events:none;margin:-15px 0 0 -15px;filter:drop-shadow(0 0 8px var(--b))}
/* ✅ ปรับตำแหน่ง toast ให้อยู่ตรงกลางฝั่งขวาตามรูป */
#toast{position:fixed;top:50%;right:16px;transform:translateY(-50%);z-index:40;pointer-events:none}
#toast span{display:inline-block;background:#000c;border:1px solid var(--b);padding:6px 14px;border-radius:14px;font-size:12px;font-weight:700;animation:fi .25s}
@keyframes fi{from{transform:scale(.7);opacity:0}}
.ban{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle,var(--c) 0,#000d 70%)}
.ban.on{display:flex;animation:bn 1.4s forwards}.ban div{font-size:clamp(28px,8vw,60px);font-weight:900;text-align:center;text-shadow:0 0 20px var(--c);letter-spacing:2px}
@keyframes bn{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0}}
.cut{position:fixed;inset:0;z-index:50;background:#000;display:none;overflow:hidden}.cut.in{display:block}
.h{position:absolute;top:0;bottom:0;width:62%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}
.L{left:0;clip-path:polygon(0 0,100% 0,68% 100%,0 100%);background:repeating-linear-gradient(100deg,#0003 0 8px,transparent 8px 22px),linear-gradient(135deg,var(--c),#05040f)}
.R{right:0;clip-path:polygon(32% 0,100% 0,100% 100%,0 100%);background:repeating-linear-gradient(80deg,#0003 0 8px,transparent 8px 22px),linear-gradient(315deg,var(--c2),#05040f)}
.L>*{margin-right:22%}.R>*{margin-left:22%}
.big{font-size:min(30vw,150px);line-height:1}.big .portrait{width:min(25vw,210px);height:min(42vh,300px);object-fit:cover;object-position:center 25%;border-radius:14px;border:2px solid #ffffff55;box-shadow:0 0 28px var(--c);display:block}.nm{font-size:16px;text-align:center}
.in .L{animation:sl .4s both}.in .R{animation:sr .4s both}@keyframes sl{from{transform:translateX(-100%)}}@keyframes sr{from{transform:translateX(100%)}}
.ttl{position:absolute;left:0;right:0;top:42%;text-align:center;font-size:clamp(26px,7vw,54px);font-weight:900;font-style:italic;text-shadow:0 0 18px var(--c),3px 3px #000;opacity:0;z-index:3}
.in .ttl{animation:tt 1s .35s both}@keyframes tt{0%{opacity:0;transform:scale(2.2) skewX(-10deg)}25%{opacity:1;transform:scale(1) skewX(-10deg)}90%{opacity:1}100%{opacity:0}}
.go .L .big{animation:dash .7s both}.go .R .big{animation:hurt .7s both}

.fl2{position:absolute;inset:0;background:#fff;opacity:0;z-index:4}.go .fl2{animation:fh .5s both}@keyframes fh{0%{opacity:.95}100%{opacity:0}}
.dm{position:absolute;right:12%;bottom:14%;font-size:clamp(40px,12vw,90px);font-weight:900;color:#ff5a5a;z-index:5;opacity:0;text-shadow:3px 3px #000}.go .dm{animation:fu2 .9s .15s both}@keyframes fu2{to{opacity:1;transform:translateY(-20px) scale(1.05)}}
.dbg{position:fixed;inset:0;background:#000a;z-index:100}.dcard{position:fixed;z-index:101;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,440px);max-height:88vh;overflow:auto;padding:18px 16px;border-radius:16px;background:linear-gradient(135deg,#0b0830,#100828);border:2px solid var(--c);box-shadow:0 20px 60px #000;line-height:1.6}
.dcard .em{font-size:40px;text-align:center}.dcard .portrait{display:block;width:100%;height:140px;object-fit:cover;object-position:center 25%;border-radius:10px;margin:0 auto 8px}.bt{display:flex;gap:6px;justify-content:center;margin-top:10px;position:sticky;bottom:-18px;padding:10px 0 0;background:linear-gradient(transparent,#100828 24%)}.inspectCard{max-height:88vh;overflow:auto}.dcard .bt button{min-height:36px;flex:1}.dcard .portrait{height:170px}.inspectCard .portrait{height:155px}.inspectCard .portrait{height:120px}.inspectStats{text-align:center;font-size:12px;background:#ffffff0a;border:1px solid #ffffff16;border-radius:9px;padding:7px;margin:8px 0}.inspectSkills>div{padding:6px 8px;margin-top:5px;background:#ffffff08;border:1px solid #ffffff12;border-radius:8px}.inspectSkills>div b{display:block;font-size:12px}.inspectSkills small{display:block;color:var(--m);font-size:10px}
.wv{position:fixed;left:0;right:0;height:60px;z-index:30;pointer-events:none;background:linear-gradient(90deg,transparent,var(--b),#fff,var(--b),transparent);animation:wv .6s forwards}@keyframes wv{from{opacity:0}to{opacity:1}}
.bgs{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;min-height:16px;margin-top:2px}
.bg{font-size:11px;background:#0009;border-radius:8px;padding:0 5px;cursor:help;pointer-events:auto}
/* Premium hover inspection panel */
#hoverTip{position:fixed;z-index:55;width:min(280px,calc(100vw - 20px));max-height:min(54vh,390px);overflow:hidden;pointer-events:none;opacity:0;transform:translateY(7px) scale(.985);transition:opacity .13s ease,transform .13s ease;filter:drop-shadow(0 14px 28px #000b);--hc:#35e0ff}
#hoverTip.show{opacity:1;transform:translateY(0) scale(1)}
.ht-shell{position:relative;border:1px solid color-mix(in srgb,var(--hc),white 25%);border-radius:14px;overflow:hidden;background:linear-gradient(145deg,#171333f7,#080714fa 75%);box-shadow:inset 0 0 0 1px #ffffff0c,0 0 22px color-mix(in srgb,var(--hc),transparent 78%)}
.ht-shell:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,transparent,var(--hc),white,var(--hc),transparent)}
.ht-head{display:flex;align-items:center;gap:8px;padding:9px 10px 7px;background:linear-gradient(110deg,color-mix(in srgb,var(--hc),transparent 84%),transparent 78%);border-bottom:1px solid #ffffff12}
.ht-em{flex:0 0 42px;height:42px;display:grid;place-items:center;font-size:27px;border-radius:12px;overflow:hidden;background:linear-gradient(145deg,color-mix(in srgb,var(--hc),transparent 76%),#090817);border:1px solid color-mix(in srgb,var(--hc),transparent 45%);box-shadow:inset 0 0 16px color-mix(in srgb,var(--hc),transparent 88%)}
.ht-title{font-size:13px;font-weight:900;letter-spacing:.2px;line-height:1.25}.ht-sub{font-size:9px;color:var(--hc);font-weight:800;text-transform:uppercase;letter-spacing:1.3px;margin-top:4px}
.ht-body{padding:8px 9px 10px;overflow:hidden;max-height:calc(min(54vh,390px) - 62px);font-size:10px;line-height:1.4;color:#e8e4ff}
.ht-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:7px}.ht-stat{background:#ffffff08;border:1px solid #ffffff10;border-radius:7px;padding:4px 5px}.ht-stat b{display:block;font-size:11px;color:white}.ht-stat span{font-size:9px;color:#a9a2d0;text-transform:uppercase;letter-spacing:.7px}
.ht-section{font-size:9px;font-weight:900;color:var(--hc);letter-spacing:1px;text-transform:uppercase;margin:7px 0 4px}.ht-skill{padding:5px 6px;margin-top:4px;border:1px solid #ffffff12;border-radius:8px;background:linear-gradient(100deg,#ffffff08,transparent);display:grid;grid-template-columns:24px 1fr;gap:7px}.ht-sicon{font-size:14px;text-align:center}.ht-skill b{display:block;color:#fff;font-size:10px}.ht-skill small{display:block;color:#aaa4cd;font-size:9px}.ht-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.ht-tag{font-size:9px;padding:2px 5px;border-radius:20px;border:1px solid color-mix(in srgb,var(--hc),transparent 55%);background:color-mix(in srgb,var(--hc),transparent 90%);color:#f5f0ff}

#over{position:fixed;inset:0;z-index:60;background:#000c;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:44px;font-weight:900}

async function bot(){
  await sleep(600);
  if(S.over || S.cur !== 1) return;
  const p=S.p[1], o=S.p[0];
  const go=async a=>{
    if(S.over || S.cur !== 1) return 0;
    const ev=[];
    if(!A(S,1,a,ev)) return 0;
    // Queue the UI update without blocking the bot action loop.
    // pump() serializes queued snapshots and animations.
    commit0(ev);
    return 1;
  };

  if(p.drawn<2 && Math.random()<.5) await go({t:'draw'});
  await sleep(100);

  for(let i=0; i<p.hand.length; i++){
    const j=p.hand.findIndex(c=>c.k=='c' && CC[c.id]<=p.light);
    if(j<0 || p.field.length>=p.slots) break;
    if(!await go({t:'play',i:j})) break;
  }

  for(let i=0; i<p.hand.length; i++){
    const j=p.hand.findIndex(c=>c.k=='e' && c.id!='ts' && p.light>=E[c.id].c && (c.id!='slot'||p.hand.some(x=>x.k=='c')));
    if(j<0 || Math.random()<.3) break;
    const id=p.hand[j].id; let tg=0;
    if(E[id].tg){
      if(!p.field.length) break;
      tg=p.field.reduce((b,x,k)=>x.hp/x.mhp<p.field[b].hp/p.field[b].mhp?k:b,0);
    }
    if(!await go({t:'play',i:j,tg})) break;
  }

  const ts=p.hand.findIndex(c=>c.id=='ts');
  if(ts>=0 && p.light>=5) await go({t:'play',i:ts});

  for(let i=0; i<p.field.length && !S.over; i++){
    const c=p.field[i];
    if(!c || c.acted || c.hp<=0) continue;
    const tg=o.field.length?o.field.reduce((b,x,k)=>x.hp<o.field[b].hp?k:b,0):0, r=Math.random();
    const has=n=>SKS[CC[c.id]].includes(n);
    if(c.light>=3&&has(3)) await go({t:'skill',c:i,s:3,tg});
    else if(c.light>=2&&has(4)&&o.field.length>=2&&r<.5) await go({t:'skill',c:i,s:4});
    else if(c.light>=2&&has(2)&&!S.dom[1]&&r<.6) await go({t:'skill',c:i,s:2});
    else if(c.light>=1&&r<.4) await go({t:'charge',c:i});
    else if(Math.random()<.6) await go({t:'def',c:i});
    else await go({t:'skill',c:i,s:0,tg});
  }

  if(!S.over && S.cur==1){
    await go({t:'end'});
  }
}

function online(code,isHost){

  peer=new Peer();

   conn.on('data',msg=>{if(msg.t==='st')recv(msg.d.S,msg.d.ev)})});

 }}

function showHover(el,x,y){
 if(!G||!el||!$('#game').offsetParent)return hideHover();
 let data;
 if(el.classList.contains('bg')){data=hoverStatus(el);if(!data)return hideHover()}
 else if(el.classList.contains('dm2')){data={col:'#b58cff',em:'🌌',title:el.dataset.name||el.textContent.trim(),sub:'DOMAIN EFFECT',body:`<div class="ht-section">Domain details</div><div>${el.dataset.turns||'?'} turns remaining · Power ${el.dataset.power||'?'}</div>`}}
 else if(el.classList.contains('ch')){const [s,i]=el.id.slice(1).split('_').map(Number),c=G.p[s]?.field[i];if(!c)return hideHover();data=hoverCharacter(c,s===SEAT?'YOUR':'ENEMY')}
 else if(el.classList.contains('cd')){const h=G.p[SEAT]?.hand[+el.dataset.h];if(!h)return hideHover();data=hoverCard(h)}
 else return hideHover();
 hoverTip.style.setProperty('--hc',data.col||'#35e0ff');
 hoverTip.innerHTML=`<div class="ht-shell"><div class="ht-head"><div class="ht-em">${data.em}</div><div><div class="ht-title">${hEsc(data.title)}</div><div class="ht-sub">${hEsc(data.sub)}</div></div></div><div class="ht-body" style="overflow:hidden">${data.body}</div></div>`;
 hoverTip.classList.add('show');hoverTip.setAttribute('aria-hidden','false');positionHover(x,y);

function positionHover(x,y){
 const gap=12,w=hoverTip.offsetWidth||320,h=hoverTip.offsetHeight||250;
 const ar=hoverAnchor?hoverAnchor.getBoundingClientRect():{left:x,top:y,right:x,bottom:y,width:0,height:0};
 // Prefer beside the hovered card, rather than over it (which blocks clicks).
 let left=ar.right+gap;
 if(left+w>innerWidth-8) left=ar.left-w-gap;
 if(left<8) left=Math.max(8,Math.min(innerWidth-w-8,x+gap));
 let top=Math.max(8,Math.min(innerHeight-h-8,ar.top));
 // If the panel still overlaps the card vertically/horizontally, move it above/below.
 const overlaps=left<ar.right && left+w>ar.left && top<ar.bottom && top+h>ar.top;
 if(overlaps){
  const below=ar.bottom+gap, above=ar.top-h-gap;
  if(below+h<=innerHeight-8) top=below;
  else if(above>=8) top=above;
 }
 hoverTip.style.left=left+'px';hoverTip.style.top=top+'px';
}
function hideHover(){hoverTip.classList.remove('show');hoverTip.setAttribute('aria-hidden','true');hoverPinned=false;cancelHoverShow()}
let hoverAnchor=null, hoverHideTimer=null, hoverShowTimer=null, hoverMouseX=-1, hoverMouseY=-1, hoverPinned=false;
function cancelHoverHide(){if(hoverHideTimer){clearTimeout(hoverHideTimer);hoverHideTimer=null}}
function cancelHoverShow(){if(hoverShowTimer){clearTimeout(hoverShowTimer);hoverShowTimer=null}}
function scheduleHoverShow(el,x,y){
 cancelHoverShow();
 hoverShowTimer=setTimeout(()=>{
  hoverShowTimer=null;
  // Only show if the pointer is still on the same card/status element.
  if(!hoverPinned && hoverAnchor===el && el.isConnected && document.elementFromPoint(hoverMouseX,hoverMouseY)?.closest('.bg,.dm2')===el){
   showHover(el,hoverMouseX>=0?hoverMouseX:x,hoverMouseY>=0?hoverMouseY:y);
  }
 },500);
}
function pointerOverHoverTip(){
 const r=hoverTip.getBoundingClientRect();
 return hoverTip.classList.contains('show') && hoverMouseX>=r.left&&hoverMouseX<=r.right&&hoverMouseY>=r.top&&hoverMouseY<=r.bottom;
}
function scheduleHoverHide(){
 cancelHoverHide();
 hoverHideTimer=setTimeout(()=>{
  const under=document.elementFromPoint(hoverMouseX,hoverMouseY)?.closest('.bg,.dm2');
  if(!pointerOverHoverTip() && under!==hoverAnchor){hideHover();hoverAnchor=null;}
 },180);
}
// Only status effects and domains use hover inspection. Character/card details open on click.
document.addEventListener('pointerover',e=>{
 hoverMouseX=e.clientX;hoverMouseY=e.clientY;
 if(e.target.closest('#hoverTip')){
  cancelHoverHide();cancelHoverShow();hoverPinned=true;return;
 }
 const el=e.target.closest('.bg,.dm2');
 if(!el) return;
 if(hoverAnchor===el){cancelHoverHide();return;}
 // Keep the current detail panel visible while crossing another card.
 // Replace it only after the pointer has dwelled on the new target for 500ms.
 cancelHoverShow();cancelHoverHide();
 hoverPinned=false;
 hoverAnchor=el;
 scheduleHoverShow(el,e.clientX,e.clientY);
});
document.addEventListener('pointermove',e=>{

 if(pointerOverHoverTip()){cancelHoverHide();hoverPinned=true;return;}
 if(hoverPinned) hoverPinned=false;
 if(hoverTip.classList.contains('show') && hoverAnchor){
  const under=document.elementFromPoint(e.clientX,e.clientY)?.closest('.bg,.dm2');
  if(under===hoverAnchor) positionHover(e.clientX,e.clientY);

document.addEventListener('pointerout',e=>{

// The detail panel does not capture clicks. Mouse wheel can still scroll details.

 if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom) return;
 const body=hoverTip.querySelector('.ht-body');
 if(body && body.scrollHeight>body.clientHeight){body.style.overflowY='auto';body.scrollTop+=e.deltaY;e.preventDefault();}

    if(c0.light<k.c){toast('Not enough character Light',800);return}
    if(G.tc<=1&&k.t!='sup'){toast('Cannot attack on Turn 1',800);return}
    if(['melee','bullet','ult'].includes(k.t)&&G.p[op].field.some(x=>x.hp>0)){
     U={t:{a:{t:'skill',c,s:n},side:op}};render();toast('Select target enemy',800);
    }else{
     U={};hideDc();doAct({t:'skill',c,s:n});
    }
    return;
   }
  }
 }
 
 // Selecting Card in hand
 if(cd){
  const hi=+cd.dataset.h;if(G.p[me].hand[hi]!==undefined){U={h:hi};render();}
  return;
 }
 
 // Selecting Character on field
 if(chE&&s==me&&my&&G.p[me].field[i]&&!G.p[me].field[i].acted){
  if(U.c===i){U={inspect:{s,i}};render();return;}U={c:i};render();return;
 }
 
 U={};render();
});
